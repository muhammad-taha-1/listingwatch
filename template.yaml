AWSTemplateFormatVersion: '2010-09-09'
# The SAM transform expands the short AWS::Serverless::* resources below into
# plain CloudFormation (Lambda function, IAM role, API Gateway routes, ...).
Transform: AWS::Serverless-2016-10-31
Description: ListingWatch - Express API on Lambda plus a nightly link checker

Parameters:
  CorsOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Dashboard origin allowed by CORS (set to the Vercel URL once it exists)
  SsmPrefix:
    Type: String
    Default: /listingwatch
    AllowedPattern: ^/[\w/-]+[^/]$
    Description: Path prefix of the SSM SecureString parameters holding the secrets
  LogLevel:
    Type: String
    Default: info
    AllowedValues: [fatal, error, warn, info, debug, trace, silent]
  AlertEmail:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[^@\s]+@[^@\s]+$
    # Kept out of samconfig.toml (the repo is public). Pass it once with
    # --parameter-overrides; later deploys reuse the previous value.
    Description: Email that receives alarm notifications (empty = no subscription)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

# Settings shared by every function below (each can still override them).
Globals:
  Function:
    CodeUri: api/
    Runtime: nodejs22.x
    # Graviton (ARM) is about 20% cheaper per GB-second than x86; the bundles
    # are plain JavaScript, so nothing needs compiling for it.
    Architectures: [arm64]
    MemorySize: 512
    Environment:
      Variables:
        NODE_ENV: production
        LOG_LEVEL: !Ref LogLevel
        # Parameter NAMES only; lib/ssm.ts fetches the values at cold start.
        MONGODB_URI_PARAM: !Sub ${SsmPrefix}/MONGODB_URI

Resources:
  # Public HTTPS endpoint. HTTP API is the cheaper, simpler flavour of API
  # Gateway; it forwards every request to ApiFunction (see Events below).
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Caps requests per second for the whole API, so a runaway client or bot
      # can't run up the Lambda bill. Plenty for a demo dashboard.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 20

  # The Express app (src/lambda.ts) as one Lambda function. Express does the
  # routing, so API Gateway only needs a single catch-all route.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      # HTTP API gives up after 30s, so 29s is the most a request can use.
      # Covers an AI review that retries or re-asks the model.
      Timeout: 29
      Environment:
        Variables:
          CORS_ORIGIN: !Ref CorsOrigin
          ANTHROPIC_API_KEY_PARAM: !Sub ${SsmPrefix}/ANTHROPIC_API_KEY
          ADMIN_TOKEN_PARAM: !Sub ${SsmPrefix}/ADMIN_TOKEN
          # POST /checks/run hands each run to this function (runDispatcher.ts).
          CHECKER_FUNCTION_NAME: !Ref CheckerFunction
      # SAM adds these statements to the function's IAM role, on top of the
      # basic permission to write CloudWatch logs. Least privilege throughout.
      Policies:
        # Read only these three parameters, nothing else in SSM. No kms:Decrypt
        # is needed because the SecureStrings use the AWS-managed aws/ssm key,
        # which lets SSM decrypt for any principal allowed to read them.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/MONGODB_URI
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/ANTHROPIC_API_KEY
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/ADMIN_TOKEN
        # Start the checker, and no other function.
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt CheckerFunction.Arn
      Events:
        # No Path/Method = the $default route: every request goes to Express.
        AllRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
    # `sam build` bundles src/lambda.ts and its imports into one file with esbuild.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2023
        Minify: false
        # Bundling renames some classes (ObjectId became _ObjectId), and
        # Mongoose looks some types up by class name. Keep the original names.
        KeepNames: true
        # Some bundled CommonJS packages call require(); ESM has no require, so
        # this banner recreates it at the top of the bundle.
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          # Already in the nodejs22.x runtime, so leave it out of the bundle.
          - '@aws-sdk/*'
          # Optional MongoDB driver add-ons we don't use; the driver loads them
          # only if present.
          - kerberos
          - '@mongodb-js/zstd'
          - snappy
          - socks
          - aws4
          - gcp-metadata
          - mongodb-client-encryption

  # Runs the link check over every restaurant (src/checker-job.ts): nightly
  # from the schedule below, or on demand when the API invokes it.
  CheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: checker-job.handler
      # ~30 restaurants take ~15s today; 5 minutes leaves plenty of headroom.
      # Lambda's hard maximum is 15 minutes, which caps how far one run scales.
      Timeout: 300
      # Only the database: the checker never sees the Anthropic key or admin token.
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/MONGODB_URI
      # Async invokes (from the API and the scheduler) are retried twice by
      # default. A retry would check everything again, so turn it off: a failed
      # run fires the Errors alarm instead and someone looks at it.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        # EventBridge Scheduler: invokes the function at 03:00 UTC every day
        # with the event { "trigger": "schedule" }.
        Nightly:
          Type: ScheduleV2
          Properties:
            Description: Nightly ListingWatch link check
            ScheduleExpression: cron(0 3 * * ? *)
            ScheduleExpressionTimezone: UTC
            Input: '{"trigger":"schedule"}'
            # The scheduler's own retries, also off for the same reason.
            RetryPolicy:
              MaximumRetryAttempts: 0
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/checker-job.ts
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2023
        Minify: false
        KeepNames: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - '@aws-sdk/*'
          - kerberos
          - '@mongodb-js/zstd'
          - snappy
          - socks
          - aws4
          - gcp-metadata
          - mongodb-client-encryption

  # Lambda would create these log groups itself, but with logs kept forever.
  # Declaring them sets a 14-day retention and deletes them with the stack.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  CheckerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CheckerFunction}
      RetentionInDays: 14

  # ---- Alerting --------------------------------------------------------------

  # Every alarm below publishes to this SNS topic when it fires (AlarmActions)
  # and again when it recovers (OKActions); SNS forwards both to the email.
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ListingWatch alerts

  # AWS emails a confirmation link first; nothing is delivered until it's clicked.
  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Any 5xx from the API. Express turns most failures into a 500 response,
  # which Lambda counts as a *successful* invocation, so Lambda's Errors metric
  # alone would miss them. API Gateway sees every 5xx, including Lambda crashes.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The ListingWatch API returned a 5xx response
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # No requests = no data = nothing wrong.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # The API Lambda itself failed: a cold start that couldn't load secrets or
  # reach Atlas, a timeout, or an out-of-memory crash.
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ApiFunction invocations failed (crash, timeout or failed cold start)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # A check run failed as a whole (e.g. the database is unreachable) or the
  # checker got an event it didn't understand. Broken restaurant links are
  # results, not errors, so they don't trigger this.
  CheckerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CheckerFunction failed - a check run did not complete
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CheckerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  # Turns each completed nightly run's run_summary log line into a data point
  # (value 1) of a custom metric, ListingWatch/ScheduledRunsCompleted.
  ScheduledRunCompletedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CheckerFunctionLogGroup
      FilterPattern: '{ $.msg = "run_summary" && $.status = "completed" && $.trigger = "schedule" }'
      MetricTransformations:
        - MetricNamespace: ListingWatch
          MetricName: ScheduledRunsCompleted
          MetricValue: '1'
          Unit: Count

  # Alerting on *missing success*: fires when no nightly run has completed in
  # the last 26 hours (daily schedule + 2h slack), whatever the reason - the
  # schedule was disabled, the function was never invoked, or it hung. The
  # Errors alarms can't catch these, because nothing errors.
  # Most hours have no run at all, so missing data must count as breaching;
  # the alarm needs all 26 hourly points to breach, so one completed run in
  # the window keeps it OK. (Alarms with periods of 1h+ may look back 7 days.)
  MissedNightlyRunAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No nightly ListingWatch check run has completed in 26 hours
      Namespace: ListingWatch
      MetricName: ScheduledRunsCompleted
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 26
      DatapointsToAlarm: 26
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

Outputs:
  ApiUrl:
    Description: Base URL of the API (use it as VITE_API_URL in the dashboard)
    Value: !GetAtt HttpApi.ApiEndpoint
  ApiFunctionName:
    Description: Lambda function name (for the console and logs)
    Value: !Ref ApiFunction
  CheckerFunctionName:
    Description: Checker Lambda name (to invoke it by hand or read its logs)
    Value: !Ref CheckerFunction
  AlertsTopicArn:
    Description: SNS topic the alarms publish to
    Value: !Ref AlertsTopic
